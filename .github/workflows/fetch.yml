name: Weermodellen ophalen
on:
  schedule:
    - cron: "47 3 * * *"   # 4u47 winter / 5u47 zomer (Brussel)
    - cron: "33 4 * * *"   # 5u33 winter / 6u33 zomer
  workflow_dispatch:
  push:
    paths: ["fetch.py", ".github/workflows/fetch.yml"]
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Modellen ophalen
        run: python3 fetch.py
      - name: Opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Weerdata $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
