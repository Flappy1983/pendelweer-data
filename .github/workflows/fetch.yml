name: Weermodellen ophalen
on:
  schedule:                # GitHub start geplande runs niet gegarandeerd: daarom meerdere kansen
    - cron: "41 16 * * *"  # 17u41 winter: reserve voor de volgende ochtend
    - cron: "13 2 * * *"   # 3u13 winter / 4u13 zomer (Brussel)
    - cron: "47 3 * * *"   # 4u47 winter / 5u47 zomer
    - cron: "33 4 * * *"   # 5u33 winter / 6u33 zomer
    - cron: "7 5 * * *"    # 6u07 winter / 7u07 zomer
  workflow_dispatch:
  push:
    paths: ["fetch.py", ".github/workflows/fetch.yml"]
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Modellen ophalen
        run: python3 fetch.py
      - name: Opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Weerdata $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
