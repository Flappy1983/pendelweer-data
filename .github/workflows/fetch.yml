name: Weermodellen ophalen
on:
  # Geplande runs starten bij GitHub 5 tot 8 uur te laat (gemeten 10-11/11/2026). De ochtendtaak
  # start het ophalen daarom zelf om 6u49 (workflow_dispatch); deze runs zijn alleen reserve.
  schedule:
    - cron: "41 16 * * *"
    - cron: "11 20 * * *"
  workflow_dispatch:
  push:
    paths: ["fetch.py", ".github/workflows/fetch.yml"]
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Modellen ophalen
        run: python3 fetch.py
      - name: Opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Weerdata $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
